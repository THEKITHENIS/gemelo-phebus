<style>
:root{
  --bg:#eef1f5; --surface:#fff; --surface-2:#f3f6f9; --ink:#15233b; --ink-2:#4b5c76; --ink-3:#7b8aa1;
  --line:#d4dbe5; --accent:#0f7d75; --accent-ink:#0a5d57;
  --shadow:0 1px 2px rgba(21,35,59,.06),0 10px 28px rgba(21,35,59,.10);
}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{
  background:var(--bg); color:var(--ink); display:flex; flex-direction:column; overflow:hidden;
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:15px;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
header{
  flex:0 0 auto; padding:10px 14px calc(10px + env(safe-area-inset-top,0)) 14px;
  background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px;
}
header h1{margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em; line-height:1.25}
header p{margin:1px 0 0; font-size:11.5px; color:var(--ink-3)}
.langs{margin-left:auto; display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; flex:0 0 auto}
.langs button{font:inherit; font-size:13px; padding:5px 10px; border:0; background:var(--surface); color:var(--ink-2)}
.langs button[aria-pressed="true"]{background:var(--accent); color:#fff}
model-viewer{flex:1 1 auto; width:100%; min-height:0; background:linear-gradient(#eef2f6,#dde5ee); --poster-color:transparent}
.sheet{
  flex:0 0 auto; background:var(--surface); border-top:1px solid var(--line);
  padding:12px 14px calc(14px + env(safe-area-inset-bottom,0)) 14px; box-shadow:var(--shadow);
}
.arbtn{
  width:100%; font:inherit; font-size:16px; font-weight:500; padding:14px; border-radius:12px;
  border:0; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; gap:9px;
}
.arbtn:disabled{background:var(--surface-2); color:var(--ink-3)}
.nota{margin:9px 0 0; font-size:12.5px; color:var(--ink-3); text-align:center}
.datos{display:flex; gap:8px; margin:0 0 11px}
.datos div{
  flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
  padding:8px 6px; text-align:center; font-size:11px; color:var(--ink-3); line-height:1.3;
}
.datos b{display:block; font-size:15px; font-weight:600; color:var(--ink)}
.links{display:flex; gap:8px; margin-top:10px}
.links a{
  flex:1; text-align:center; font-size:13.5px; text-decoration:none; padding:10px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
}
.logos{display:flex; gap:10px; align-items:center; justify-content:center; margin-top:12px}
.logos img{height:22px; width:auto; display:block}
</style>
</head>

var T = {
  t:{es:"Chasis autónomo Phebus", eu:"Phebus txasis autonomoa"},
  s:{es:"AUTONOMOUS CAMPUS · CIFP Mendizabala LHII", eu:"AUTONOMOUS CAMPUS · CIFP Mendizabala LHII"},
  d1:{es:"de largo", eu:"luze"},
  d2:{es:"motores de buje", eu:"gurpileko motorrak"},
  d3:{es:"de carga", eu:"karga"},
  ar:{es:"Verlo a tamaño real", eu:"Benetako tamainan ikusi"},
  n_ok:{es:"Apunta al suelo y muévete alrededor del chasis.", eu:"Apuntatu lurrera eta mugitu txasisaren inguruan."},
  n_no:{es:"Este móvil no admite realidad aumentada, pero puedes girar el chasis con el dedo.",

  full:{es:"Gemelo completo", eu:"Biki osoa"},
  reset:{es:"Centrar el modelo", eu:"Eredua zentratu"}
};
var lang="es";
function paint(){
  document.documentElement.lang = lang==="eu" ? "eu" : "es";
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var k=el.dataset.i18n; if(T[k]) el.textContent=T[k][lang]||T[k].es;
  });
  var n=document.getElementById("nota");
  n.textContent = (mv && mv.canActivateAR===false) ? T.n_no[lang] : T.n_ok[lang];
}
document.getElementById("lang-es").addEventListener("click",function(){ setLang("es"); });
document.getElementById("lang-eu").addEventListener("click",function(){ setLang("eu"); });
function setLang(l){
  lang=l;
  document.getElementById("lang-es").setAttribute("aria-pressed", l==="es");
  document.getElementById("lang-eu").setAttribute("aria-pressed", l==="eu");
  paint();
}
document.getElementById("logos").innerHTML =
  ["mendizabala","mgep","mobility"].map(function(k){
    return LOGO[k] ? "<img src='data:image/png;base64,"+LOGO[k]+"' alt=''>" : "";
  }).join("");

var mv=document.getElementById("mv"), btn=document.getElementById("btn-ar");
btn.addEventListener("click", function(){
  if(mv.canActivateAR) mv.activateAR();
});
mv.addEventListener("load", function(){
  if(!mv.canActivateAR){ btn.disabled=true; }
  paint();
});
document.getElementById("reset").addEventListener("click", function(e){
  e.preventDefault();
  mv.cameraOrbit="40deg 74deg 6.5m"; mv.fieldOfView="32deg";
});
paint();
